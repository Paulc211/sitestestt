<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Testing</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }

      h1 {
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(4rem, 15vw, 12rem);
        font-weight: 900;
        text-transform: uppercase;
        animation: flash 0.8s infinite;
      }

      @keyframes flash {
        0%, 49% {
          opacity: 1;
        }
        50%, 100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1>TESTING</h1>
  </body>
</html>
