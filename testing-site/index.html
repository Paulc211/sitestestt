<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Testing Site</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        background: #000;
        color: #fff;
      }

      main {
        display: grid;
        place-items: center;
        width: min(100%, 56rem);
        padding: 2rem;
      }

      h1 {
        margin: 0;
        font-size: 3rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
        text-align: center;
        text-transform: uppercase;
        text-wrap: balance;
        text-shadow:
          0 0 14px rgba(255, 255, 255, 0.32),
          0 0 46px rgba(255, 255, 255, 0.2);
        animation: pulse 1.45s ease-in-out infinite;
        will-change: opacity, transform, filter;
      }

      @media (min-width: 42rem) {
        h1 {
          font-size: 5rem;
        }
      }

      @media (min-width: 72rem) {
        h1 {
          font-size: 6.5rem;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
          filter: blur(0);
          transform: scale(0.965);
        }

        50% {
          opacity: 1;
          filter: blur(0.2px);
          transform: scale(1.045);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Testing site splash screen">
      <h1>Testing Site</h1>
    </main>
  </body>
</html>
