name: fetch-quince-assets
on:
  push:
    branches:
      - "claude/quinceañera-party-qr-site-pzk0ug"
    paths:
      - ".github/workflows/fetch-quince-assets.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack generated assets
        run: |
          curl -fsSL -o /tmp/assets.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3GCwGHFvJxKSyrV9vcWpb4O0mX4/89030f94-3189-4bd3-be3c-d234a25e10ce.zip"
          mkdir -p /tmp/unpacked hasta-el-amanecer/photos
          unzip -o /tmp/assets.zip -d /tmp/unpacked
          mv /tmp/unpacked/demo*.webp hasta-el-amanecer/photos/
          mv /tmp/unpacked/bg.mp4 hasta-el-amanecer/bg.mp4
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hasta-el-amanecer
          git commit -m "Add generated background video and demo wall photos"
          git push
