<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL PANDA — Stream Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03040a;
    --cyan:#19e6ff;
    --magenta:#ff2bd6;
    --white:#f4f8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Rajdhani',system-ui,sans-serif;color:var(--white)}

  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;background:#000}
  #ai{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
  #ai.on{opacity:1}

  /* ---------- gate (click to play) ---------- */
  #gate{
    position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at center,#0a0f22 0%,#03040a 70%);
    transition:opacity .5s ease;
  }
  #gate.hide{opacity:0;pointer-events:none}
  #gate h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(28px,6vw,64px);letter-spacing:.14em;
    background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(25,230,255,.45))}
  #gate p{opacity:.65;letter-spacing:.2em;text-transform:uppercase;font-size:14px}
  .btn{
    font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:14px;
    padding:14px 30px;border:1px solid rgba(25,230,255,.6);border-radius:999px;background:rgba(25,230,255,.08);color:var(--white);cursor:pointer;
    box-shadow:0 0 24px rgba(25,230,255,.25), inset 0 0 14px rgba(25,230,255,.12);transition:transform .15s ease,box-shadow .2s ease
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(255,43,214,.35), inset 0 0 14px rgba(255,43,214,.18)}
  .btn.ghost{border-color:rgba(255,255,255,.25);background:transparent;box-shadow:none;font-size:11px;padding:10px 20px}

  /* ---------- controls ---------- */
  #ctrl{position:absolute;right:16px;bottom:16px;z-index:30;display:flex;gap:8px;opacity:0;transition:opacity .3s}
  #stage:hover #ctrl{opacity:1}
  body.obs #ctrl{display:none}

  /* ---------- fallback CSS intro ---------- */
  #fx{position:absolute;inset:0;display:none;overflow:hidden;background:#000}
  #fx.on{display:block}
  #particles{position:absolute;inset:0;width:100%;height:100%}
  .beam{
    position:absolute;top:-40%;left:50%;width:22vw;height:180%;
    transform-origin:top center;opacity:0;mix-blend-mode:screen;filter:blur(18px);
    background:linear-gradient(to bottom,rgba(25,230,255,0) 0%,rgba(25,230,255,.55) 40%,rgba(25,230,255,0) 100%);
  }
  .beam.m{background:linear-gradient(to bottom,rgba(255,43,214,0) 0%,rgba(255,43,214,.5) 40%,rgba(255,43,214,0) 100%)}
  #fx.play .beam{animation:beam 3.2s cubic-bezier(.2,.8,.2,1) forwards}
  #fx.play .beam.b1{animation-delay:.2s;--from:-38deg;--to:-14deg}
  #fx.play .beam.b2{animation-delay:.45s;--from:36deg;--to:16deg}
  #fx.play .beam.b3{animation-delay:.7s;--from:-8deg;--to:4deg}
  @keyframes beam{0%{opacity:0;transform:translateX(-50%) rotate(var(--from))}30%{opacity:.9}100%{opacity:.35;transform:translateX(-50%) rotate(var(--to))}}
  .grid{
    position:absolute;inset:-20%;opacity:.16;
    background-image:linear-gradient(rgba(25,230,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(25,230,255,.35) 1px,transparent 1px);
    background-size:64px 64px;transform:perspective(600px) rotateX(62deg) translateY(30%);
    mask-image:radial-gradient(ellipse at center,#000 20%,transparent 70%);
  }
  #fx.play .grid{animation:gridmove 6s linear infinite}
  @keyframes gridmove{from{background-position:0 0}to{background-position:0 64px}}

  .logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .panda{width:clamp(140px,26vw,300px);opacity:0;transform:scale(.6);filter:drop-shadow(0 0 0 rgba(25,230,255,0))}
  #fx.play .panda{animation:pandain 1.6s cubic-bezier(.16,1,.3,1) 1.1s forwards,eyes 2.2s ease-in-out 2.7s infinite}
  @keyframes pandain{0%{opacity:0;transform:scale(.6) translateY(30px)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 28px rgba(25,230,255,.55))}}
  @keyframes eyes{0%,100%{filter:drop-shadow(0 0 28px rgba(25,230,255,.55))}50%{filter:drop-shadow(0 0 46px rgba(25,230,255,.95))}}

  .word{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(40px,10vw,130px);letter-spacing:.16em;display:flex;line-height:1;
    text-shadow:0 0 14px rgba(25,230,255,.6),0 0 40px rgba(255,43,214,.45)}
  .word span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(-80deg);color:var(--white)}
  .word span.gap{width:.35em}
  #fx.play .word span{animation:letter .7s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes letter{to{opacity:1;transform:none}}
  .tag{font-size:clamp(12px,1.8vw,20px);letter-spacing:.5em;text-transform:uppercase;opacity:0;color:var(--cyan)}
  #fx.play .tag{animation:tagin 1s ease 3.4s forwards}
  @keyframes tagin{to{opacity:.85;letter-spacing:.35em}}

  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
  #fx.play .flash{animation:flash .5s ease-out 2.35s forwards}
  @keyframes flash{0%{opacity:0}10%{opacity:.85}100%{opacity:0}}

  .scan{position:absolute;inset:0;pointer-events:none;opacity:.25;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%)}

  /* ---------- credits pill ---------- */
  #links{position:absolute;left:16px;bottom:16px;z-index:30;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .3s}
  #stage:hover #links{opacity:.7}
  #links a{color:var(--cyan);text-decoration:none;margin-right:14px}
  body.obs #links{display:none}
</style>
</head>
<body>
<div id="stage">

  <!-- AI generated intro clip (Higgsfield / Kling 3.0) -->
  <video id="ai" playsinline preload="auto" crossorigin="anonymous"></video>

  <!-- CSS/JS fallback intro (also used if the clip can't load) -->
  <div id="fx">
    <canvas id="particles"></canvas>
    <div class="grid"></div>
    <div class="beam b1"></div>
    <div class="beam m b2"></div>
    <div class="beam b3"></div>
    <div class="logo">
      <svg class="panda" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="eye" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#19e6ff"/><stop offset="1" stop-color="#19e6ff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="hp" x1="0" x2="1"><stop offset="0" stop-color="#19e6ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
        </defs>
        <!-- headphones band -->
        <path d="M38 96 C38 40 162 40 162 96" fill="none" stroke="url(#hp)" stroke-width="9" stroke-linecap="round"/>
        <!-- ears -->
        <circle cx="52" cy="62" r="26" fill="#0b0d14"/><circle cx="148" cy="62" r="26" fill="#0b0d14"/>
        <!-- head -->
        <path d="M100 32 C150 32 172 70 172 108 C172 152 140 178 100 178 C60 178 28 152 28 108 C28 70 50 32 100 32Z" fill="#f4f8ff"/>
        <!-- eye patches -->
        <ellipse cx="72" cy="104" rx="24" ry="30" transform="rotate(-18 72 104)" fill="#0b0d14"/>
        <ellipse cx="128" cy="104" rx="24" ry="30" transform="rotate(18 128 104)" fill="#0b0d14"/>
        <!-- glowing eyes -->
        <circle cx="74" cy="104" r="12" fill="url(#eye)"/><circle cx="126" cy="104" r="12" fill="url(#eye)"/>
        <circle cx="74" cy="104" r="4.5" fill="#fff"/><circle cx="126" cy="104" r="4.5" fill="#fff"/>
        <!-- nose / mouth -->
        <ellipse cx="100" cy="136" rx="11" ry="8" fill="#0b0d14"/>
        <path d="M90 150 Q100 160 110 150" fill="none" stroke="#0b0d14" stroke-width="4" stroke-linecap="round"/>
        <!-- ear cups -->
        <rect x="24" y="86" width="22" height="42" rx="10" fill="#0b0d14" stroke="url(#hp)" stroke-width="3"/>
        <rect x="154" y="86" width="22" height="42" rx="10" fill="#0b0d14" stroke="url(#hp)" stroke-width="3"/>
      </svg>
      <div class="word" id="word"></div>
      <div class="tag">Live · Now Streaming</div>
    </div>
    <div class="flash"></div>
    <div class="scan"></div>
    <div class="vignette"></div>
  </div>

  <div id="gate">
    <h1>EL PANDA</h1>
    <p>Stream intro</p>
    <button class="btn" id="play">▶ &nbsp;Play intro</button>
    <button class="btn ghost" id="playfx">Play CSS version</button>
  </div>

  <div id="ctrl">
    <button class="btn ghost" id="replay">↻ Replay</button>
    <button class="btn ghost" id="swap">Swap version</button>
  </div>
  <div id="links">
    <a id="dl" href="#" target="_blank" rel="noopener">Download clip</a>
    <a id="dlimg" href="#" target="_blank" rel="noopener">Logo art</a>
  </div>
</div>

<script>
  // ---- AI assets (generated with Higgsfield: GPT Image 2.5 key art -> Kling 3.0 Pro animation) ----
  const CLIP_URL = "https://d8j0ntlcm91z4.cloudfront.net/user_3GCwGHFvJxKSyrV9vcWpb4O0mX4/hf_20260929_221517_cbdc5195-2022-464a-bccf-64708067e657.mp4";
  const LOGO_URL = "https://d8j0ntlcm91z4.cloudfront.net/user_3GCwGHFvJxKSyrV9vcWpb4O0mX4/hf_20260929_221351_28d75aeb-12eb-426b-b03b-1a0a73be6bd8.png";

  const q = new URLSearchParams(location.search);
  const obs = q.has('autoplay') || q.has('obs');
  if (obs) document.body.classList.add('obs');

  const ai = document.getElementById('ai');
  const fx = document.getElementById('fx');
  const gate = document.getElementById('gate');
  document.getElementById('dl').href = CLIP_URL;
  document.getElementById('dlimg').href = LOGO_URL;

  // letters for the CSS wordmark
  const word = document.getElementById('word');
  [...'EL PANDA'].forEach((ch, i) => {
    const s = document.createElement('span');
    if (ch === ' ') { s.className = 'gap'; }
    else { s.textContent = ch; s.style.animationDelay = (1.9 + i * 0.09) + 's'; }
    word.appendChild(s);
  });

  // ---- particles ----
  const cv = document.getElementById('particles'), cx = cv.getContext('2d');
  let P = [], raf;
  function size(){ cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', size); size();
  function seed(){ P = Array.from({length: 140}, () => ({
    x: Math.random()*cv.width, y: Math.random()*cv.height,
    r: Math.random()*2+.4, v: Math.random()*.5+.15, a: Math.random()*Math.PI*2,
    c: Math.random() < .5 ? '25,230,255' : '255,43,214' })); }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    for (const p of P){
      p.y -= p.v; p.x += Math.sin(p.a += .01) * .3;
      if (p.y < -5){ p.y = cv.height + 5; p.x = Math.random()*cv.width; }
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle = `rgba(${p.c},${.35 + Math.sin(p.a*3)*.25})`; cx.fill();
    }
    raf = requestAnimationFrame(tick);
  }

  // ---- modes ----
  let mode = 'ai';
  function stopAll(){
    cancelAnimationFrame(raf);
    fx.classList.remove('on','play'); ai.classList.remove('on');
    ai.pause(); ai.removeAttribute('src'); ai.load();
  }
  function playFX(){
    mode = 'fx'; stopAll();
    fx.classList.add('on'); seed(); tick();
    // restart CSS animations
    void fx.offsetWidth; fx.classList.add('play');
  }
  function playAI(){
    mode = 'ai'; stopAll();
    if (!CLIP_URL || CLIP_URL.startsWith('__')) return playFX();
    ai.src = CLIP_URL; ai.muted = false; ai.classList.add('on');
    const p = ai.play();
    if (p && p.catch) p.catch(() => { ai.muted = true; ai.play().catch(playFX); });
  }
  ai.addEventListener('error', playFX);
  ai.addEventListener('ended', () => { if (q.has('loop')) playAI(); });

  document.getElementById('play').onclick = () => { gate.classList.add('hide'); playAI(); };
  document.getElementById('playfx').onclick = () => { gate.classList.add('hide'); playFX(); };
  document.getElementById('replay').onclick = () => (mode === 'ai' ? playAI() : playFX());
  document.getElementById('swap').onclick = () => (mode === 'ai' ? playFX() : playAI());
  addEventListener('keydown', e => { if (e.key === 'r') document.getElementById('replay').click(); });

  // OBS browser source: ?autoplay=1 (add &css=1 to force the CSS version, &loop=1 to loop)
  if (obs){ gate.classList.add('hide'); q.has('css') ? playFX() : playAI(); }
</script>
</body>
</html>
